    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="preload" as="image" href="/favicon.png" fetchpriority="high" />

    <link rel="canonical" href="/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Openflip" />
    <meta property="og:title" content="Openflip — Photo & short‑video social network" />
    <meta property="og:description" content="Share photos and short videos, follow creators, and discover trending content on Openflip." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/2lCcdnLj2DhLfOcMPsCSj7g8IUc2/social-images/social-1775311808249-openflip.webp">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Openflip — Photo & short‑video social network" />
    <meta name="twitter:description" content="Share photos and short videos, follow creators, and discover trending content on Openflip." />

    <script type="application/ld+json">

        "@context": "https://schema.org",

        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://openflip.lovable.app/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }

      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
