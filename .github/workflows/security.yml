name: Security & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-audit:
    name: Lint, Typecheck & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: TypeScript typecheck
        run: bunx tsc --noEmit

      - name: Dependency audit (high & critical)
        run: bun audit --audit-level=high
        continue-on-error: false

  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  supabase-migrations:
    name: Supabase Migration Sanity Check
    runs-on: ubuntu-latest
    if: hashFiles('supabase/migrations/**/*.sql') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Check for dangerous SQL patterns
        run: |
          set -e
          echo "Scanning migrations for risky patterns..."
          PATTERNS='ALTER DATABASE postgres|DROP SCHEMA (auth|storage|realtime|vault|supabase_functions)|GRANT ALL .* TO PUBLIC|DISABLE ROW LEVEL SECURITY'
          if grep -rEn "$PATTERNS" supabase/migrations/; then
            echo "::error::Dangerous SQL pattern detected in migrations"
            exit 1
          fi
          echo "Scanning for tables created without RLS..."
          # Flag CREATE TABLE statements in public schema that aren't followed by ENABLE ROW LEVEL SECURITY in the same file
          for f in supabase/migrations/*.sql; do
            if grep -iEq 'create table (if not exists )?(public\.)?[a-z_]+' "$f"; then
              if ! grep -iq 'enable row level security' "$f"; then
                echo "::warning file=$f::CREATE TABLE without ENABLE ROW LEVEL SECURITY in same migration"
              fi
            fi
          done
          echo "Migration sanity check passed."
